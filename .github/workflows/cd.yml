name: Build and release plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: bun tools/verify-release.ts
      - run: bun install --frozen-lockfile
      - run: mkdir -p .sdk && cp tools/sdk.package.json .sdk/package.json
      - run: bun install --cwd .sdk --ignore-scripts
      - run: bun run sdk:link
      - run: bun run build
      - run: bun run test
      - run: bun run test:package
      - name: Package tested plugin
        run: bun pm pack --ignore-scripts --destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: matterbridge-tuya-cloud
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: matterbridge-tuya-cloud
          path: artifacts
      - name: Publish tested tarball to npm with OIDC
        run: npm publish artifacts/*.tgz --ignore-scripts --access public --tag latest
