name: Build and release plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Resolve release version
        id: version
        if: github.event_name == 'push'
        run: |
          current=$(node -p "require('./package.json').version")
          bumped=false
          while git rev-parse -q --verify "refs/tags/v$current" >/dev/null; do
            npm version patch --no-git-tag-version >/dev/null
            current=$(node -p "require('./package.json').version")
            bumped=true
          done
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: mkdir -p .sdk && cp tools/sdk.package.json .sdk/package.json
      - run: bun install --cwd .sdk --ignore-scripts
      - run: bun run sdk:link
      - name: Test
        run: bun run test
        background: true
      - run: bun run build
      - run: bun run test:package
      - name: Wait for tests
        wait-all:
      - name: Package tested plugin
        run: bun pm pack --ignore-scripts --destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: matterbridge-tuya-cloud
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Commit version and tag release
        env:
          BUMPED: ${{ needs.build.outputs.bumped }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMPED" = "true" ]; then
            npm version "$VERSION" --no-git-tag-version >/dev/null
            git commit -am "chore(matterbridge-tuya-cloud): release v$VERSION [skip ci]"
          fi
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: matterbridge-tuya-cloud
          path: artifacts
      - name: Publish tested tarball to npm with OIDC
        run: npm publish ./artifacts/*.tgz --ignore-scripts --access public --tag latest
