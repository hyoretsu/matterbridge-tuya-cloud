name: Local fixture acceptance
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: mkdir -p .sdk && cp tools/sdk.package.json .sdk/package.json
      - run: bun install --cwd .sdk --ignore-scripts
      - run: bun run sdk:link
      - run: bun run build
      - run: bun run test
      - run: bun run test:package
