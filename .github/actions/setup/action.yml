name: Setup workspace
description: Install bun, dependencies and the Matterbridge SDK link
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - run: bun install --frozen-lockfile
      shell: bash
    - run: mkdir -p .sdk && cp tools/sdk.package.json .sdk/package.json
      shell: bash
    - run: bun install --cwd .sdk --ignore-scripts
      shell: bash
    - run: bun run sdk:link
      shell: bash
